[project]
name = "jev-drive"
version = "0.1.0"
description = "Browser-based autonomous car simulator powered by Jev and TypeSafe"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "typesafe-sdk", "python-dotenv>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.9"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.vercel]
entrypoint = "driving_sim.app:app"

[tool.vercel.scripts]
build = "python build.py"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
